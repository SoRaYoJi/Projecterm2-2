<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VL Cineplex</title>
    <link rel="stylesheet" href="css/cinema.css">
</head>
<body>
<header>
    <!-- โลโก้ -->
    <div class="logo-container">
        <img class="logo" src="images/vl_cineplex.png" alt="VL Cineplex">
    </div>

    <!-- เมนูนำทาง -->
    <nav class="nav-menu">
        <ul>
            <li><a href="/home">Home page</a></li>
            <li><a href="/movies">Movies</a></li>
            <li><a href="/cinema">Cinema</a></li>
            <li><a href="/promotion">Promotion</a></li>
        </ul>
    </nav>

    <!-- เมนูด้านขวา -->
    <div class="right-menu">
        <!-- ภาษา -->
        <div class="lang-switch">
            <a href="#th">TH</a> | <a href="#en">EN</a>
        </div>
        <!-- ไอคอนผู้ใช้ -->
        <div class="user-icon">
            <a href="/profile"><img src="images/user_icon.png" alt="User Icon"></a>
        </div>
    </div>
</header>



<!-- Content -->
<h2 class="region-title">BY LOCATION</h2>
<div class="location-container">
    <!-- ภาคกลาง -->
    <div class="location-column">
        <h3>ภาคกลาง</h3>
        <ul class="cinema-list">
            <li>
                <img src="images/vl_white.png" alt="VL Cinema Logo">
                <a th:href="@{/seat}" class="location-link">
                    <span>กรุงเทพ</span>
                </a>
                <span class="star">★</span>
            </li>
            <!-- เพิ่มสาขาอื่นๆ -->
        </ul>
    </div>

    <!-- ภาคเหนือ -->
    <div class="location-column">
        <h3>ภาคเหนือ</h3>
        <ul class="cinema-list">
            <li>
                <img src="images/vl_white.png" alt="VL Cinema Logo">
                <a href="/seat?movieName=<%= movieName %>&cinemaName=เชียงใหม่" class="location-link">
                    <span>เชียงใหม่</span>
                </a>
                <span class="star">★</span>
            </li>
            <!-- เพิ่มสาขาอื่นๆ -->
        </ul>
    </div>

    <!-- ภาคตะวันออกเฉียงเหนือ -->
    <div class="location-column">
        <h3>ภาคตะวันออกเฉียงเหนือ</h3>
        <ul class="cinema-list">
            <li>
                <img src="images/vl_white.png" alt="VL Cinema Logo">
                <a href="/seat?movieName=<%= movieName %>&cinemaName=อุดรธานี" class="location-link">
                    <span>อุดรธานี</span>
                </a>
                <span class="star">★</span>
            </li>
            <!-- เพิ่มสาขาอื่นๆ -->
        </ul>
    </div>

    <!-- ภาคใต้ -->
    <div class="location-column">
        <h3>ภาคใต้</h3>
        <ul class="cinema-list">
            <li>
                <img src="images/vl_white.png" alt="VL Cinema Logo">
                <a href="/seat?movieName=<%= movieName %>&cinemaName=ภูเก็ต" class="location-link">
                    <span>ภูเก็ต</span>
                </a>

            </li>
            <!-- เพิ่มสาขาอื่นๆ -->
        </ul>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
