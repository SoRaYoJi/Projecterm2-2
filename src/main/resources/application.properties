spring.application.name=MovieTicket

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3306/movie?useSSL=false&serverTimezone=Asia/Bangkok&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=false

# Thymeleaf (remove old JSP config, use Thymeleaf)
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# File upload (for poster images if needed)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server
server.port=8080
